<section class="phone-wrap" aria-label="H5 交互演示"><div class="phone"><div class="statusbar"><span>9:41</span><span class="island"></span><span class="status-icons">▮▮▮ <span id="wifi"></span> ▰</span></div><nav class="nav"><button class="nav-btn" id="back" aria-label="返回"></button><h2 id="page-title"></h2><span class="nav-demo">演示</span></nav><div class="mobile-progress" id="mobile-progress"></div><div id="screen" class="screen"></div><div class="demo-bar"><span class="dot"></span>验收演示 · 支付、通知与开票均为模拟</div><div class="mobile-toolbar"><a class="tool" href="/solutions">返回解决方案</a><button class="tool" data-action="restart">重新演示</button><button class="tool" data-action="records">开票记录</button></div><div class="safe-bottom"></div><div id="overlay"></div></div><p class="preview-note">手机打开可全屏体验 · 所有步骤均可实际点击</p></section></main><div id="toast" class="toast" hidden role="status"></div>
<script>
const ICONS={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',back:'<path d="m15 5-7 7 7 7"/>',arrow:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',fuel:'<path d="M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17M2 21h14M6 6h6v6H6zM14 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3M19 6v4h2"/>',doc:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 14 6M4 12a8 8 0 0 0 14 6"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M3 6h1M3 12h1M3 18h1"/>',sms:'<path d="M4 4h16v13H9l-5 4zM8 8h8M8 12h5"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/>',close:'<path d="m5 5 14 14M19 5 5 19"/>',chevron:'<path d="m6 9 6 6 6-6"/>',wifi:'<path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0M12 20h.01"/>'};
const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.doc}</svg>`;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='fuel-invoice-acceptance-v1';
const initial=()=>({page:'order',fuel:'92#汽油',liters:'40',amount:'300.00',plate:'',phone:'13800000000',email:'demo@example.com',paid:false,replaced:false,channel:'sms',view:'personal',company:'',taxId:'',address:'',companyPhone:'',bank:'',account:'',optional:false,agreed:false,paidAt:'',replacedAt:'',orderId:'',invoiceId:'',newInvoiceId:''});
let state=initial(),modal='',busy=false,timer=null,toastTimer;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'&&['order','paid','messages','invoice','change','complete','records'].includes(saved.page)){state={...state,...saved};if(['paid','messages','invoice','change','complete'].includes(state.page)&&!state.paid)state.page='order';}}catch{}
const steps=[['加油支付','选择油品，填写交易及接收信息'],['个人发票','支付完成，默认开具个人发票'],['接收链接','通过短信或邮箱查看发票'],['换开企业发票','填写单位抬头，确认后提交'],['完成换开','接收新发票，随时查看下载']];
const explanations={order:'支付前只填写交易信息与接收方式，无需填写企业抬头。手机号和邮箱至少填写一项。',paid:'支付成功后，系统默认以“个人”为抬头开具发票，并按用户填写的方式发送发票链接。',messages:'模拟用户收到的短信或邮件。点击其中的发票链接，即可查看个人发票并发起换开。',invoice:'原个人发票可查看和下载。需要企业抬头时，点击“换开企业发票”继续办理。',change:'用户填写单位名称和税号后确认提交。演示原个人发票红冲、新企业发票开具的完整过程。',complete:'新企业发票开具完成，再次发送查看链接。原个人发票标记为已红冲，交易金额保持不变。',records:'同一笔支付的个人原票与企业新票在记录中关联展示，可随时查看各自状态。'};
const titles={order:'加油支付',paid:'支付结果',messages:'发票通知',invoice:'电子发票',change:'换开发票',complete:'换开结果',records:'支付开票记录'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function money(v=state.amount){return Number(v||0).toFixed(2)}
function date(v){return v?v.slice(0,10):new Date().toLocaleDateString('sv-SE')}
function timestamp(){const d=new Date();return `${d.toLocaleDateString('sv-SE')} ${d.toLocaleTimeString('en-GB',{hour12:false})}`}
function stage(){if(state.page==='order')return 0;if(state.page==='paid')return 1;if(state.page==='change')return 3;if(state.replaced)return 4;return 2}
function btn(label,action,cls='primary',extra=''){return `<button class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`}
function row(label,value){return `<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`}
function field(label,key,placeholder='',type='text',extra=''){return `<label class="field"><span>${label}</span><input name="${key}" type="${type}" value="${esc(state[key])}" placeholder="${placeholder}" ${extra}></label>`}
function station(){return `<div class="card station"><span class="station-icon">${icon('fuel',26)}</span><div><div class="kicker">加油站</div><h3>苏州泰可思数据科技有限公司</h3><p>江苏省苏州工业园区扬富路10号<br>新建元数智湾D幢305室</p></div></div>`}
function order(){return `${station()}<form id="order-form" novalidate><div class="card"><div class="section-title">加油信息<span class="tiny">按实际交易填写</span></div><div class="fuel-tabs">${['92#汽油','95#汽油','0#柴油','技术服务费'].map(f=>`<button type="button" class="fuel ${state.fuel===f?'selected':''}" data-fuel="${f}">${f}</button>`).join('')}</div><div class="two-col">${field('加油量（升） <i class="required">*</i>','liters','请输入油量','text','inputmode="decimal" maxlength="12"')}${field('支付金额（元） <i class="required">*</i>','amount','请输入金额','text','inputmode="decimal" maxlength="12"')}</div><div class="price-note">${icon('fuel',13)}<span id="unit-price">计算单价 ¥${Number(state.liters)>0? (Number(state.amount)/Number(state.liters)).toFixed(6):'0.000000'} / 升</span></div><label class="field inline"><span>车牌号</span><input name="plate" value="${esc(state.plate)}" placeholder="选填" maxlength="12"></label></div><div class="card"><div class="section-title">发票接收方式<span class="tiny">至少填写一项</span></div><label class="field inline"><span>手机号</span><input name="phone" type="tel" value="${esc(state.phone)}" placeholder="请输入手机号" maxlength="11"></label><label class="field inline"><span>邮箱</span><input name="email" type="email" value="${esc(state.email)}" placeholder="请输入电子邮箱" maxlength="100"></label><p class="helper">支付后默认开具<strong>个人发票</strong>，通过短信或邮箱发送查看链接。如需企业抬头，可收到发票后自助换开。</p></div><div class="error" id="form-error" role="alert"></div><button class="btn primary" type="submit">确认并支付 ${icon('arrow',15)}</button></form>${btn('支付开票记录','records','plain')}`}
function paid(){return `<div class="success-hero"><div class="success-icon">${icon('check',33)}</div><h3>支付成功</h3><div class="big-money"><small>¥</small>${money()}</div><p>苏州泰可思数据科技有限公司</p></div><div class="card"><div class="section-title">个人发票已开具<span class="badge">开票成功</span></div>${row('发票抬头','个人')}${row('加油信息',`${esc(state.fuel)} · ${esc(state.liters)} 升`)}${row('支付时间',esc(state.paidAt))}<div class="subline"></div><div class="flow-row"><span class="flow-dot">${icon('check',13)}</span><div><h4>交易完成，自动开具个人发票</h4><p>无需另行填写抬头信息</p></div></div><div class="flow-row"><span class="flow-dot">${icon('check',13)}</span><div><h4>发票链接已发送 <span class="tiny">（模拟）</span></h4><p>${state.phone?'短信至 '+esc(maskPhone(state.phone)):''}${state.phone&&state.email?'<br>':''}${state.email?'邮件至 '+esc(state.email):''}</p></div></div></div><div class="notice">需要开给公司？打开收到的发票链接，选择<strong>“换开企业发票”</strong>即可办理。</div>${btn('查看收到的短信 / 邮件','messages')}${btn('返回商户 · 查看开票记录','records','plain')}`}
function maskPhone(p){return p.length===11?p.slice(0,3)+'****'+p.slice(-4):p}
function availableChannels(){return [state.phone?'sms':null,state.email?'email':null].filter(Boolean)}
function messages(){const channels=availableChannels();if(!channels.includes(state.channel))state.channel=channels[0];const renewed=state.replaced;const body=`您在苏州泰可思数据科技有限公司的加油交易已${renewed?'完成企业发票换开':'开具个人电子发票'}，价税合计 <strong>¥${money()}</strong>。${renewed?'原个人发票已红冲，请以新发票作为报销凭证。':'如需企业抬头，可点击下方链接查看并换开。'}`;const link=`<a href="#invoice-${renewed?'company':'personal'}" class="message-link" data-action="open-current-invoice"><strong>${icon('doc',17)} ${renewed?'查看企业新发票':'查看发票 / 换开抬头'} ${icon('arrow',15)}</strong><span>电子发票服务 · 点击打开</span></a>`;return `<div class="segmented" role="tablist" aria-label="接收方式"><button role="tab" aria-selected="${state.channel==='sms'}" class="${state.channel==='sms'?'selected':''}" data-channel="sms" ${!state.phone?'disabled':''}>${icon('sms',15)} 短信通知</button><button role="tab" aria-selected="${state.channel==='email'}" class="${state.channel==='email'?'selected':''}" data-channel="email" ${!state.email?'disabled':''}>${icon('mail',15)} 邮箱通知</button></div><p class="message-time">${esc(renewed?state.replacedAt:state.paidAt)}</p>${state.channel==='sms'?`<div class="message-header"><span class="message-avatar">${icon('sms',21)}</span><div><h3>电子发票服务</h3><p>接收手机：${esc(maskPhone(state.phone))}</p></div></div><div class="bubble"><p>【加油站电子发票】</p><p>尊敬的客户，${body}</p>${link}</div>`:`<div class="email-card"><h3>${renewed?'企业发票换开完成，请查收':'您的加油电子发票已开具'}</h3><div class="email-meta">发件人：电子发票服务 &lt;invoice@example.com&gt;<br>收件人：${esc(state.email)}</div><div class="email-content"><p>尊敬的客户，您好：</p><p>${body}</p>${link}<div class="email-brand">苏州泰可思数据科技有限公司</div></div></div>`}<p class="footnote">以上为通知效果模拟，点击卡片内链接继续体验。</p>${btn(renewed?'查看换开结果':'返回支付结果',renewed?'complete':'paid','plain')}`}
function invoiceTicket(company){const net=Number(state.amount)/1.13,tax=Number(state.amount)-net;return `<div class="ticket-wrap"><div class="ticket"><div class="ticket-title">电子发票（普通发票）</div><div class="ticket-meta">发票号码：${company?state.newInvoiceId:state.invoiceId}<br>开票日期：${date(company?state.replacedAt:state.paidAt)}</div><div class="invoice-grid"><div class="invoice-party"><b>购买方信息</b>名称：${company?esc(state.company):'个人'}<br>纳税人识别号：${company?esc(state.taxId):'—'}</div><div class="invoice-party"><b>销售方信息</b>名称：苏州泰可思数据科技有限公司<br>纳税人识别号：演示数据</div></div><table class="invoice-table"><thead><tr><th>项目名称</th><th>数量</th><th>金额</th><th>税率</th><th>税额</th></tr></thead><tbody><tr><td>${state.fuel==='技术服务费'?'*服务*技术服务费':'*成品油*'+esc(state.fuel)}</td><td>${esc(state.liters)}</td><td>${money(net)}</td><td>13%</td><td>${money(tax)}</td></tr></tbody></table><div class="invoice-total"><span>价税合计（小写）</span><b>¥ ${money()}</b></div><div class="watermark">演示样张</div><div class="ticket-foot"><span>备注：${esc(state.plate)||'加油交易'}</span><span>仅供流程验收演示</span></div></div><div class="ticket-bottom">${icon('shield',16)}${company?'企业新发票 · 换开完成':state.replaced?'原个人发票 · 已红冲':'个人发票 · 支付后自动开具'}</div></div>`}
function invoice(){const company=state.view==='company'&&state.replaced;return `<div class="invoice-top"><h3>${company?'企业电子发票':'个人电子发票'}</h3><span class="badge ${!company&&state.replaced?'gray':''}">${!company&&state.replaced?'已红冲':'已开具'}</span></div>${!company&&state.replaced?'<div class="notice">本张个人发票已红冲。企业新发票已开具，请使用新发票。</div>':''}${invoiceTicket(company)}<div class="invoice-info">${row('发票抬头',company?esc(state.company):'个人')}${row('交易金额',`<strong>¥ ${money()}</strong>`)}${row('关联订单',esc(state.orderId))}</div><div class="button-stack">${btn(icon('download',17)+' 下载发票样张','download',company?'primary':'secondary')}${!state.replaced?btn('换开企业发票 '+icon('arrow',16),'change-prompt'):!company?btn('查看企业新发票','view-company'):''}</div>${!state.replaced?'<p class="footnote">需开给公司？填写企业抬头后即可自助换开。</p>':''}${btn('查看支付开票记录','records','plain')}`}
function change(){return `<div class="change-header"><h3>换开企业发票</h3><p>交易信息已带入，请补充企业抬头。</p></div><div class="card">${row('油品 / 油量',`${esc(state.fuel)} / ${esc(state.liters)} 升`)}${row('价税合计',`<strong style="color:var(--teal);font-size:18px">¥ ${money()}</strong>`)}${row('发票类型','电子发票（普通发票）')}</div><form id="change-form" novalidate><div class="card"><div class="section-title">发票抬头<button type="button" class="fill-demo" data-action="fill-company">填入演示企业</button></div><div class="type-tabs"><button type="button" class="type-tab" data-action="keep-personal"><span class="choice-dot"></span>个人</button><div class="type-tab selected"><span class="choice-dot"></span>单位</div></div>${field('单位名称 <i class="required">*</i>','company','请输入完整的企业名称','text','maxlength="100" autocomplete="organization"')}${field('纳税人识别号 <i class="required">*</i>','taxId','请输入统一社会信用代码','text','maxlength="20" autocapitalize="characters"')}<button type="button" class="optional-toggle" data-action="toggle-optional">其他开票信息（选填）${icon('chevron',16)}</button>${state.optional?field('企业地址','address','请输入企业地址','text','maxlength="150"')+field('企业电话','companyPhone','请输入企业电话','tel','maxlength="25"')+field('开户银行','bank','请输入开户银行','text','maxlength="100"')+field('银行账号','account','请输入银行账号','text','inputmode="numeric" maxlength="30"'):''}</div><div class="card"><div class="section-title">新发票接收方式<span class="tiny">至少填写一项</span></div>${field('手机号','phone','请输入手机号','tel','maxlength="11"')}${field('邮箱','email','请输入电子邮箱','email','maxlength="100"')}<p class="helper">换开完成后，新发票链接将发送至以上联系方式。</p></div><label class="checkbox"><input type="checkbox" name="agreed" ${state.agreed?'checked':''}><span>我已核对企业抬头及税号，知悉换开成功后原个人发票将红冲，以新开具的企业发票为准。</span></label><div id="form-error" class="error" role="alert"></div><button type="submit" class="btn primary">提交换开申请 ${icon('arrow',15)}</button></form>`}
function complete(){return `<div class="success-hero"><div class="success-icon">${icon('check',33)}</div><h3>企业发票换开成功</h3><p>原个人发票已红冲<br>新发票链接已按接收方式再次发送（模拟）</p></div><div class="card"><div class="section-title">新发票信息<span class="badge">已开具</span></div>${row('企业抬头',esc(state.company))}${row('纳税人识别号',esc(state.taxId))}${row('价税合计',`<strong style="font-size:22px">¥ ${money()}</strong>`)}<div class="subline"></div>${row('手机号',esc(maskPhone(state.phone))||'未填写')}${row('邮箱',esc(state.email)||'未填写')}</div><div class="card"><div class="flow-row"><span class="flow-dot">${icon('check',13)}</span><div><h4>原个人发票已红冲</h4><p>原发票记录保留，状态同步更新</p></div></div><div class="flow-row"><span class="flow-dot">${icon('check',13)}</span><div><h4>企业新发票已开具</h4><p>抬头已更新，交易金额不变，无需重复支付</p></div></div></div><div class="button-stack">${btn('查看新发票通知','messages')}${btn('直接查看企业新发票','view-company','secondary')}</div>${btn('支付开票记录','records','plain')}`}
function historyItem(company){return `<button class="card history-item" data-action="${company?'view-company':'view-personal'}"><div class="history-head"><div class="receipt-history"><span class="doc-icon">${icon('doc',23)}</span><div><h3>${company?'企业发票 · 换开新票':'个人发票 · 原票'}</h3><p>${esc(company?state.replacedAt:state.paidAt)}</p></div></div><span class="badge ${!company&&state.replaced?'gray':''}">${!company&&state.replaced?'已红冲':'已开具'}</span></div><div class="subline"></div>${row('发票抬头',company?esc(state.company):'个人')}${row('油品 / 油量',`${esc(state.fuel)} / ${esc(state.liters)} 升`)}<div class="history-money">¥ ${money()}</div><div class="history-link">查看发票 ${icon('arrow',12)}</div></button>`}
function records(){return !state.paid?`<div class="empty">${icon('doc',45)}<h3>暂无支付开票记录</h3><p>完成一笔加油支付后，发票将在这里展示。</p></div>${btn('去加油支付','order')}`:`<div class="receipt-title">关联订单：${esc(state.orderId)}<br>同一笔交易 · ${state.replaced?'换开已完成':'默认个人开票'}</div>${state.replaced?historyItem(true):''}${historyItem(false)}${btn(state.replaced?'查看换开结果':'查看发票通知',state.replaced?'complete':'messages','secondary')}`}
function render(){const n=stage();$('#journey').innerHTML=steps.map((s,i)=>`<div class="journey-step ${i===n?'active':i<n?'done':''}"><div class="step-num">${i<n?icon('check',14):'0'+(i+1)}</div><div><h3>${s[0]}</h3><p>${s[1]}</p></div></div>`).join('');$('#mobile-progress').innerHTML=['支付','个人开票','收取链接','企业换开','完成'].map((s,i)=>`${i?'<i>›</i>':''}<span class="${i===n?'active':''}">${s}</span>`).join('');$('#explanation').textContent=state.page==='invoice'&&state.replaced?(state.view==='company'?'查看换开后的企业新发票，支持下载演示 PDF，金额与原交易一致。':'原个人发票已标记为红冲，可从这里查看关联企业新票。'):explanations[state.page];$('#page-title').textContent=titles[state.page];$('#back').innerHTML=icon(state.page==='order'?'home':'back',20);$('#screen').innerHTML=({order,paid,messages,invoice,change,complete,records}[state.page]||order)();save()}
function go(page){clearTimeout(toastTimer);$('#toast').hidden=true;modal='';$('#overlay').innerHTML='';state.page=page;render();$('#screen').scrollTop=0;window.scrollTo({top:0,behavior:'instant'})}
function error(message){$('#form-error').textContent=message;$('#form-error').scrollIntoView({block:'center',behavior:'smooth'})}
function contactError(){if(!state.phone&&!state.email)return '手机号和邮箱至少填写一项。';if(state.phone&&!/^1\d{10}$/.test(state.phone))return '请输入正确的11位手机号。';if(state.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email))return '请输入正确的电子邮箱。';return ''}
function syncForm(form){new FormData(form).forEach((value,key)=>{state[key]=String(value).trim()});if(form.id==='change-form'){state.agreed=form.elements.agreed.checked;state.taxId=state.taxId.toUpperCase()}save()}
function showModal(kind){modal=kind;let inner='';if(kind==='pay-confirm')inner=`<div class="modal-content"><h3>确认支付</h3>${row('加油站','苏州泰可思数据科技有限公司')}${row('油品',esc(state.fuel))}${row('加油量',esc(state.liters)+' 升')}${row('支付金额',`<strong>¥ ${money()}</strong>`)}<p class="helper">支付后默认开具个人发票，并发送发票链接。</p></div><div class="modal-actions"><button data-action="close-modal">取消</button><button data-action="pay-sheet">确定</button></div>`;
if(kind==='change-prompt')inner=`<div class="modal-content"><h3>换开发票说明</h3><p class="modal-copy">本次交易已默认开具个人发票。如需企业抬头，请填写单位名称和纳税人识别号。<br><br>换开完成后，原个人发票将红冲，新发票链接会再次发送至您的手机或邮箱。</p></div><div class="modal-actions"><button data-action="close-modal">暂不换开</button><button data-action="change">继续换开</button></div>`;
if(kind==='replace-confirm')inner=`<div class="modal-content"><h3>确认企业抬头</h3>${row('单位名称',esc(state.company))}${row('纳税人识别号',esc(state.taxId))}${row('价税合计',`<strong>¥ ${money()}</strong>`)}<p class="helper">确认后演示原票红冲及企业新票开具，无需再次支付。</p></div><div class="modal-actions"><button data-action="close-modal">返回修改</button><button data-action="replace-submit">确认换开</button></div>`;
if(kind==='restart')inner=`<div class="modal-content"><h3>重新演示流程</h3><p class="modal-copy">本次模拟记录将清空，并返回加油支付页面。可重新选择短信或邮箱接收方式。</p></div><div class="modal-actions"><button data-action="close-modal">取消</button><button data-action="restart-confirm">重新开始</button></div>`;
if(kind==='pay-sheet'){$('#overlay').innerHTML=`<div class="modal-layer sheet-layer"><section class="sheet" role="dialog" aria-modal="true" aria-label="模拟微信支付"><div class="sheet-top"><button data-action="close-modal" aria-label="关闭">${icon('close',23)}</button><span>微信支付 · 模拟收银台</span></div><p class="sheet-merchant">苏州泰可思数据科技有限公司</p><div class="big-money"><small>¥</small>${money()}</div><div class="row"><span class="label">付款方式</span><span class="tiny">模拟支付</span></div><div class="payment-method"><span><span class="coin">¥</span>零钱</span><span style="color:var(--green)">${icon('check',23)}</span></div>${btn('支付','pay-submit','wechat-pay')}<p class="footnote">验收演示，不产生实际扣款</p></section></div>`;return}
$('#overlay').innerHTML=`<div class="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-label="${kind==='restart'?'重新演示':'确认操作'}">${inner}</section></div>`;$('#overlay button')?.focus()}
function process(kind){if(busy)return;busy=true;const replacing=kind==='replace';$('#overlay').innerHTML=`<div class="modal-layer"><section class="modal"><div class="processing" role="status"><div class="spinner"></div><h3 id="processing-title">${replacing?'正在红冲原个人发票':'正在确认支付'}</h3><p id="processing-detail">${replacing?'关联原票，办理换开':'支付成功后，将自动开具个人发票'}<br>请稍候…</p></div></section></div>`;timer=setTimeout(()=>{if($('#processing-title')){$('#processing-title').textContent=replacing?'正在开具企业新发票':'正在开具个人发票';$('#processing-detail').textContent='开票完成后发送发票链接（模拟）'}timer=setTimeout(()=>{if(replacing){state.replaced=true;state.replacedAt=timestamp();state.newInvoiceId='DEMO'+Date.now()+'02';state.view='company'}else{state.paid=true;state.paidAt=timestamp();state.orderId='JY'+Date.now();state.invoiceId='DEMO'+Date.now()+'01';state.channel=state.phone?'sms':'email'}busy=false;timer=null;go(replacing?'complete':'paid')},1050)},900)}
function toast(message){clearTimeout(toastTimer);$('#toast').hidden=false;$('#toast').textContent=message;toastTimer=setTimeout(()=>$('#toast').hidden=true,2800)}
function back(){if(busy)return;if(modal){modal='';$('#overlay').innerHTML='';return}if(state.page==='order'){window.scrollTo({top:0,behavior:'smooth'});return}go(({paid:'records',messages:state.replaced?'complete':'paid',invoice:'messages',change:'invoice',complete:'records',records:state.paid?(state.replaced?'complete':'paid'):'order'})[state.page]||'order')}
document.addEventListener('input',e=>{if(e.target.name&&e.target.closest('form')){state[e.target.name]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();if(['liters','amount'].includes(e.target.name)&&$('#unit-price'))$('#unit-price').textContent=`计算单价 ¥${Number(state.liters)>0&&Number.isFinite(Number(state.amount))?(Number(state.amount)/Number(state.liters)).toFixed(6):'0.000000'} / 升`}});
document.addEventListener('submit',e=>{e.preventDefault();if(busy)return;syncForm(e.target);if(e.target.id==='order-form'){if(!/^\d+(\.\d{1,3})?$/.test(state.liters)||Number(state.liters)<=0||Number(state.liters)>999999)return error('请输入大于0的加油量，最多保留3位小数。');if(!/^\d+(\.\d{1,2})?$/.test(state.amount)||Number(state.amount)<.01||Number(state.amount)>999999.99)return error('支付金额应为0.01～999999.99元，最多保留2位小数。');const issue=contactError();if(issue)return error(issue);showModal('pay-confirm')}else if(e.target.id==='change-form'){if(state.company.length<4)return error('请输入完整的单位名称。');if(!/^[0-9A-Z]{15,20}$/.test(state.taxId))return error('请输入15～20位字母或数字组成的纳税人识别号。');const issue=contactError();if(issue)return error(issue);if(!state.agreed)return error('请核对信息并勾选换开确认说明。');showModal('replace-confirm')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-fuel],[data-channel]');if(!b||busy)return;if(b.disabled)return;if(b.dataset.fuel){state.fuel=b.dataset.fuel;render();return}if(b.dataset.channel){state.channel=b.dataset.channel;render();return}e.preventDefault();const a=b.dataset.action;switch(a){case'restart':showModal('restart');break;case'restart-confirm':state=initial();go('order');break;case'close-modal':modal='';$('#overlay').innerHTML='';break;case'pay-sheet':showModal('pay-sheet');break;case'pay-submit':process('pay');break;case'change-prompt':if(!state.replaced)showModal('change-prompt');break;case'replace-submit':if(!state.replaced)process('replace');break;case'fill-company':state.company='苏州示例科技有限公司';state.taxId='91320594MA0000000X';render();toast('已填入演示企业信息');break;case'toggle-optional':state.optional=!state.optional;render();break;case'keep-personal':go('invoice');break;case'open-current-invoice':state.view=state.replaced?'company':'personal';go('invoice');break;case'view-company':state.view='company';go('invoice');break;case'view-personal':state.view='personal';go('invoice');break;case'download':downloadInvoice();break;case'change':if(!state.replaced)go('change');break;default:if(['order','paid','messages','complete','records'].includes(a))go(a)}});
$('#back').onclick=back;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&!busy)back()});
function downloadInvoice(){const company=state.view==='company'&&state.replaced;const c=document.createElement('canvas');c.width=1400;c.height=980;const ctx=c.getContext('2d');ctx.fillStyle='#fffdfb';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#a94d4d';ctx.font='38px "Songti SC", serif';ctx.textAlign='center';ctx.fillText('电子发票（普通发票）',700,80);ctx.font='20px "PingFang SC", sans-serif';ctx.fillText('演示样张 · 仅供流程验收演示',700,122);ctx.textAlign='left';ctx.strokeStyle='#cbaaa0';ctx.lineWidth=2;ctx.strokeRect(60,250,1280,480);ctx.beginPath();ctx.moveTo(60,425);ctx.lineTo(1340,425);ctx.moveTo(60,490);ctx.lineTo(1340,490);ctx.moveTo(60,645);ctx.lineTo(1340,645);ctx.stroke();ctx.fillStyle='#705c55';ctx.font='21px "PingFang SC", sans-serif';const lines=[['发票号码：'+(company?state.newInvoiceId:state.invoiceId),60,182],['开票日期：'+date(company?state.replacedAt:state.paidAt),1000,182],['购买方信息',85,292],['名称：'+(company?state.company:'个人'),85,345],['纳税人识别号：'+(company?state.taxId:'—'),85,393],['销售方：苏州泰可思数据科技有限公司',700,292],['项目名称',85,467],['数量（升）',550,467],['金额',780,467],['税率',1020,467],['税额',1190,467],[(state.fuel==='技术服务费'?'*服务*':'*成品油*')+state.fuel,85,555],[state.liters,550,555],[money(Number(state.amount)/1.13),780,555],['13%',1020,555],[money(Number(state.amount)-Number(state.amount)/1.13),1190,555],['价税合计（小写）',85,695],['¥ '+money(),1100,695],['关联订单：'+state.orderId,60,785],['发票状态：'+(company?'企业新票，已开具':state.replaced?'原个人发票，已红冲':'个人原票，已开具'),60,830],['备注：'+(state.plate||'加油交易')+'  '+(company?[state.address,state.companyPhone,state.bank,state.account].filter(Boolean).join(' / '):''),60,875]];lines.forEach(([t,x,y])=>ctx.fillText(t,x,y,x<700?620:620));ctx.save();ctx.translate(700,510);ctx.rotate(-.25);ctx.fillStyle='#b386761b';ctx.font='bold 110px "PingFang SC",sans-serif';ctx.textAlign='center';ctx.fillText('演示样张',0,0);ctx.restore();const jpg=Uint8Array.from(atob(c.toDataURL('image/jpeg',.93).split(',')[1]),ch=>ch.charCodeAt(0));const enc=new TextEncoder();const chunks=[];let pos=0;const offsets=[0];function add(v){const bytes=typeof v==='string'?enc.encode(v):v;chunks.push(bytes);pos+=bytes.length}function obj(n,body){offsets[n]=pos;add(n+' 0 obj\n'+body+'\nendobj\n')}add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 590] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');offsets[4]=pos;add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width 1400 /Height 980 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');add(jpg);add('\nendstream\nendobj\n');const stream='q\n842 0 0 590 0 0 cm\n/Im0 Do\nQ\n';obj(5,'<< /Length '+enc.encode(stream).length+' >>\nstream\n'+stream+'endstream');const xref=pos;add('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');const blob=new Blob(chunks,{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(company?'企业新发票':'个人发票')+'-演示样张.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('已生成发票样张 PDF')}
$('#brand-icon').innerHTML=icon('fuel',23);$('#wifi').innerHTML=icon('wifi',13);document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,14));render();
</script>
